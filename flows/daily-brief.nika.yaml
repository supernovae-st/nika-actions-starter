# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# Local AI News Brief, with receipts.
# Fetch Hacker News' front-page feed, keep the top stories, have a LOCAL
# model write the brief, save it. Every run leaves a hash-chained
# trace (`nika trace verify`), and `nika check` audits the whole plan
# BEFORE a single token is spent.
#
#   nika check news_brief.nika.yaml            # static audit (offline)
#   nika run  news_brief.nika.yaml             # real local run (Ollama)
#   nika run  news_brief.nika.yaml --model mock/echo   # zero-setup dry run
nika: v1
workflow:
  id: local-ai-news-brief
  description: "HN front page → top 8 stories → local-model brief → brief.md (+ tamper-evident trace)"

model: ollama/llama3.2:3b        # local by default, swap for any provider

const:
  feed_url: "https://news.ycombinator.com/rss"
  out_path: "./brief.md"

# The blast radius, declared in the file. This flow may reach exactly two
# tools, fetch one host and write one path. Anything else is refused before
# a request leaves your machine, not after.
permits:
  tools: ["nika:fetch", "nika:jq", "nika:write"]   # the only tools it may invoke
  net:   { http: ["news.ycombinator.com"] }        # one host · every other is denied
  fs:    { write: ["./brief.md"] }                 # writes one file · reads nothing
  exec:  false                                     # this workflow runs zero shells

tasks:
  fetch_feed:
    invoke:
      tool: "nika:fetch"
      args:
        url: "${{ const.feed_url }}"
        mode: feed

  top_stories:
    with:
      fetch_feed: ${{ tasks.fetch_feed.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ with.fetch_feed }}
        expression: |
          [.items[]? | {title, url: .link}] | .[0:8]

  brief:
    with:
      top_stories: ${{ tasks.top_stories.output }}
    infer:
      prompt: |
        You are writing a morning tech brief. Here are today's top
        Hacker News stories as JSON:

        ${{ with.top_stories }}

        Write a short brief: one section per story, the title as a
        heading, then ONE sentence on why it might matter to a
        developer. Plain markdown, no preamble.
      max_tokens: 600

  save:
    with:
      brief: ${{ tasks.brief.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "${{ const.out_path }}"
        content: "${{ with.brief }}"
        overwrite: true

outputs:
  stories:
    value: ${{ tasks.top_stories.output }}
    # `array` alone is not a type: the primitives are lowercase and the
    # compound forms are mappings. The jq step emits exactly {title, url}.
    type: { array: { object: { title: string, url: string } } }
    description: "the stories the brief covers (title + url)"


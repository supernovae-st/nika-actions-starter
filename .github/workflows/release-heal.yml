name: release-heal

# New clones must start on the current wave (done by hand twice on
# 2026-07-13). Daily: move every release pin together through the tested
# scripts/heal_pins.py: the reusable workflow's engine default, the engine
# example in nika.yml, and both first-party nika-action pins (latest
# published nika-action tag). The healed bytes live INSIDE workflow files,
# which GITHUB_TOKEN can never push (GitHub App `workflows` wall — struck
# live on the 0.103 wave): the push rides a deploy key instead, the same
# no-clock pattern as the tap. SECURITY: no github.event data in the shell.

on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.STARTER_DEPLOY_KEY }}
      - name: The template default follows the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo supernovae-st/nika --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9][0-9.]*$ ]] || { echo "::error::unexpected tag: $tag"; exit 1; }
          ver="${tag#v}"
          action="$(gh release view --repo supernovae-st/nika-action --json tagName --jq .tagName)"
          [[ "$action" =~ ^v1\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected nika-action tag: $action"; exit 1; }
          python3 scripts/heal_pins.py --engine "${ver}" --action "${action}"
          if git diff --quiet; then echo "pins already ${ver} · ${action} — nothing to heal"; exit 0; fi
          git config user.name "nika-release[bot]"
          git config user.email "nika@supernovae.studio"
          git add .github/workflows/nika-check.yml .github/workflows/nika.yml
          git commit -m "chore: the starter follows nika ${ver} and nika-action ${action} (release-heal)" && git push
          echo "healed to ${ver} · ${action}"

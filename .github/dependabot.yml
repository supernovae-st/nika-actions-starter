# Keep this starter's own CI action pins fresh in one grouped weekly PR.
# (The first-party nika-action is pinned to its exact release tag and is not
# bumped here: release-heal.yml moves it with the engine pins through
# scripts/heal_pins.py, so one owner moves them together.)
#
# Grouped on purpose: a split-pair action (codeql-action/init +
# codeql-action/analyze must move in lockstep) landing as two separate
# PRs drifts out of sync between merges. One grouped PR moves every pin
# atomically (lesson: nika-spec 2026-07-19).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "supernovae-st/nika-action"
    groups:
      github-actions:
        patterns:
          - "*"
